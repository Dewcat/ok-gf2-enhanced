name: Build fork release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install cython setuptools polib
      - name: Run tests
        timeout-minutes: 10
        run: |
          Get-ChildItem -LiteralPath tests -Filter "Test*.py" | Sort-Object Name | ForEach-Object {
            python -u -m unittest discover -s tests -p $_.Name -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Select compatible launcher
        id: launcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_launcher.py prepare
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/actions/pyappify/package-lock.json
      - name: Install packaging action dependencies
        run: npm ci --omit=dev --prefix .github/actions/pyappify
      - name: Test packaging configuration
        run: node --test .github/actions/pyappify/build-config.test.js
      - name: Build Windows installers
        uses: ./.github/actions/pyappify
        with:
          version: ${{ steps.launcher.outputs.version }}
          use_release: ${{ steps.launcher.outputs.reuse_url }}
          reuse_asset: ${{ steps.launcher.outputs.reuse_asset }}
          reuse_sha256: ${{ steps.launcher.outputs.reuse_sha256 }}
          compression: zlib
      - name: Version artifacts and calculate checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          Get-ChildItem -LiteralPath pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-$env:RELEASE_VERSION$($_.Extension)"
          }
          python scripts/release_launcher.py finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -LiteralPath pyappify_dist -Filter '*-setup-*.exe')
          if ($installers.Count -lt 2) { throw 'Expected both full and online installers' }
          Get-ChildItem -LiteralPath pyappify_dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath pyappify_dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ github.ref_name }}
          path: pyappify_dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-${{ github.ref_name }}
          path: pyappify_dist
      - uses: softprops/action-gh-release@v2
        with:
          name: 'OK-GF2 Enhanced ${{ github.ref_name }}'
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          body: |
            ## 相比 v1.2.75 的更新

            - 新增免费礼包防误购：打开详情后重新核验价格为“免费”；遇到售罄、晶条礼包或识别不明确时跳过，领取后关闭详情，避免继续购买付费礼包。
            - 修复安装版版本号显示：启动器未提供版本号时，从当前安装目录的 app.json 读取，源码运行仍显示 dev。
            - 合入原仓巡录免费档领取修复（AliceJump/ok-gf2#69）：兼容两种入口，改为查找“一键领取／领取”，避免因找不到“沿途行动”而中断每日任务。
            - 合入原仓加载帧误点修复（AliceJump/ok-gf2#60）：跳过剧情时，遇到空 OCR、“资源加载中”或百分比进度暂停右上角点击，减少推图结算卡死。
            - 软件标题与发布名称统一使用 OK-GF2 Enhanced；内部版本与 Git 标签保持 v数字.数字.数字，增强版独立递增。
            - 更新中英文 README 的增强版介绍，新增免费礼包防误购说明，并补充礼包、版本号、巡录和加载帧回归测试。

            本版本不包含尚在开发中的异位冲突自动化。

            ## 下载

            下载 `ok-gf2-win32-dewcat-setup-${{ github.ref_name }}.exe` 完整安装包（包含 Python 和依赖）。
            `online-setup` 为在线安装包，首次启动需要联网下载依赖。
            `SHA256SUMS.txt` 提供附件校验值。Source code 为源码，不是安装包。

            自动化检查已通过；本版本尚未完成游戏内完整流程验证。

            [完整改动](https://github.com/Dewcat/ok-gf2-enhanced/compare/v1.2.75...v1.2.76)
          files: pyappify_dist/*
